name: Build the project

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        # https://github.com/actions/setup-java#usage
        with:
          java-version: "21"
          distribution: "zulu"
          cache: "maven"

      - name: Build the project
        run: mvn --batch-mode --no-transfer-progress --update-snapshots -DskipTests -Dmatchbox.version=4.1.10 site
